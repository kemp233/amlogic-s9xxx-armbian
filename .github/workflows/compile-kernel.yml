name: Compile the kernel

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: "Select the kernel source"
        required: false
        default: "unifreq"
        type: choice
        options:
          - unifreq
          - ophub
          - unifreq/linux-6.1.y-rockchip

      kernel_version:
        description: "Select kernel version"
        required: false
        default: "6.1.y"
        type: choice
        options:
          - all
          - 5.10.y
          - 5.15.y
          - 6.1.y
          - 6.6.y
          - 6.12.y
          - 6.18.y
      kernel_auto:
        description: "Auto use the latest kernel"
        required: false
        default: true
        type: boolean
      delete_source:
        description: "Delete source after compilation"
        required: false
        default: true
        type: boolean
      kernel_package:
        description: "Select compile package list"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - dtbs
      kernel_toolchain:
        description: "Select the compilation toolchain"
        required: false
        default: "gcc"
        type: choice
        options:
          - clang
          - gcc
          - gcc-15.3
          - gcc-15.2
          - gcc-14.3
          - gcc-14.2
      ccache_clear:
        description: "Set whether to clear the cache"
        required: false
        default: false
        type: boolean
      docker_image:
        description: "Select Armbian docker image"
        required: false
        default: "resolute"
        type: choice
        options:
          - trixie
          - bookworm
          - resolute
          - noble
      kernel_sign:
        description: "Set the kernel custom signature"
        required: false
        default: "-ophub"
        type: choice
        options:
          - -ophub
          - -yourname
      kernel_patch:
        description: "Set the directory for kernel patches"
        required: false
        default: "compile-kernel/tools/patch"
      kernel_config:
        description: "Select kernel config"
        required: false
        default: "false"
        type: choice
        options:
          - false
          - rockchip-bsp-6.1

env:
  TZ: Etc/UTC

jobs:
  setup:
    runs-on: ubuntu-26.04-arm
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set build matrix based on kernel_version input
        id: set-matrix
        run: |
          if [[ "${{ inputs.kernel_version }}" == "all" ]]; then
            MATRIX='{"include":[{"kernel_version":"5.10.y"},{"kernel_version":"5.15.y"},{"kernel_version":"6.1.y"},{"kernel_version":"6.6.y"},{"kernel_version":"6.12.y"},{"kernel_version":"6.18.y"}]}'
          else
            MATRIX='{"include":[{"kernel_version":"${{ inputs.kernel_version }}"}]}'
          fi
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"

  build:
    needs: setup
    runs-on: ubuntu-26.04-arm
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    name: compile-kernel-${{ matrix.kernel_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize the build environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          # 替换 Azure APT 镜像为 Ubuntu 全球官方源 + 禁用 Azure mirrorlist
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list 2>/dev/null || true
          sudo find /etc/apt/sources.list.d -name "*.list" -exec sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' {} +
          sudo sed -i 's|http://security.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list 2>/dev/null || true
          sudo find /etc/apt/sources.list.d -name "*.list" -exec sed -i 's|http://security.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' {} +
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          echo 'Acquire::http::Timeout "120";' | sudo tee -a /etc/apt/apt.conf.d/80-retries
          echo 'Acquire::https::Timeout "120";' | sudo tee -a /etc/apt/apt.conf.d/80-retries
          # 如果 mirrorlist 在，替换为 archive.ubuntu.com
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2604-build-armbian-depends)
          sudo systemctl daemon-reload
          #sudo apt-get -y full-upgrade
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
          sudo rm -rf ~/{.cargo,.dotnet,.rustup}
          sudo timedatectl set-timezone "${TZ:-Etc/UTC}"
          sudo ntpdate ntp.ubuntu.com 0.pool.ntp.org || true
          sudo timedatectl set-ntp true
          date -u
          timedatectl status || true
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Create virtual disk for extended storage
        id: disk
        run: |
          # Get available space in exact GB
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Error: Insufficient space on /: ${root_avail}G available"; exit 1; }

          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          echo "Using /: ${root_size}G"

          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          df -Th
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Get kernel source commit hash
        id: kernelhash
        run: |
          # Get the latest source hash from the kernel repository
          api_url="https://api.github.com/repos/${{ inputs.kernel_source }}/linux-${{ matrix.kernel_version }}/git/ref/heads/main"
          source_hash=$(curl -fsSL -m 20 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              ${api_url} |
              jq -r '.object.sha'
          )
          [[ -z "${source_hash}" || "${source_hash}" == "null" ]] && source_hash="${{ github.sha }}"
          echo "source_hash=${source_hash}" >> ${GITHUB_ENV}
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: /builder/ccache
          key: kernel-${{ inputs.kernel_toolchain }}-${{ matrix.kernel_version }}-${{ env.source_hash }}
          restore-keys: |
            kernel-${{ inputs.kernel_toolchain }}-${{ matrix.kernel_version }}-

      - name: 📂 编译链全要素前置审计
        run: |
          echo "==== 1️⃣ 静态参数审计 ===="
          echo "kernel_patch  = ${{ inputs.kernel_patch }}"
          echo "kernel_source = ${{ inputs.kernel_source }}"
          echo "kernel_version= ${{ matrix.kernel_version }}"
          echo "kernel_package= ${{ inputs.kernel_package }}"
          echo "kernel_auto   = ${{ inputs.kernel_auto }}"
          echo "kernel_toolchain = ${{ inputs.kernel_toolchain }}"
          echo "ccache_clear  = ${{ inputs.ccache_clear }}"
          echo "auto_patch    = true"
          echo "docker_image  = ophub/armbian-${{ inputs.docker_image }}:arm64"
          echo ""
          echo "==== 2️⃣ 内核配置审计 (.config 状态) ===="
          echo "[注意] .config 将在 ophub 容器内生成，此处仅审计本地挂载点"
          ls -la /builder/compile-kernel/kernel/*/.config 2>/dev/null || echo ".config 尚未生成(容器内)"
          echo ""
          echo "==== 3️⃣ DTC 编译工具链审计 ===="
          which dtc 2>/dev/null && dtc --version 2>/dev/null || echo "dtc 未安装(将使用容器内版本)"
          echo ""
          echo "==== 4️⃣ 编译缓存审计 (ccache) ===="
          if command -v ccache 2>/dev/null; then
            ccache -s 2>/dev/null || echo "ccache 无统计"
          else
            echo "ccache 未安装宿主机(容器内使用)"
          fi
          echo ""
          echo "==== 5️⃣ NPU/VPU 特征审计 ===="
          echo "备份当前容器内 Makefile/dts 引用"
          echo "lb2004 DTS 引用的 BSP 节点:"
          grep -n '&rknpu\|&npu\|&bus_npu\|&vop\|&hdmi\|&pcie30phy\|&pcie3x2\|&can[0-9]' \
            ${{ github.workspace }}/compile-kernel/tools/patch/linux-6.1.y/rk3566-lb2004.dts 2>/dev/null || echo "DTS 文件不可用"
          echo ""
          echo "==== 前置审计完成 ===="

      - name: 🔬 启动三维编译链探针 (进程/文件/快照)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq inotify-tools || true
          echo "==== 三维探针已启动 ===="
          # 探针 1: 进程调用链追踪
          (
          while true; do
            ts=$(date +"%H:%M:%S.%3N")
            ps -eo pid,cmd --no-headers 2>/dev/null | grep -E "patch|git clone|git checkout|make dtbs|docker run|rm -rf.*dts|cp.*dts|sed.*rockchip|kernel_compile" | while read pid cmd; do
              echo "[$ts] PID=$pid CMD=$cmd" >> /tmp/proc_trace.log
            done
            sleep 0.5
          done
          ) & echo "PROC_PROBE_PID=$!" >> $GITHUB_ENV
          
          # 探针 2: 文件系统事件追踪
          (
          inotifywait -m -r /builder -e create -e delete -e moved_from -e moved_to --format "%T %e %w%f" --timefmt "%H:%M:%S" 2>/dev/null | while read line; do
            echo "$line" | grep -E "rockchip|lb2004|dts|Makefile" >> /tmp/ino_events.log
          done
          ) &
          echo "INOTIFY_PROBE_PID=$!" >> $GITHUB_ENV
          
          # 探针 3: 强制快照探针
          (
          while true; do
            echo "--- $(date +"%H:%M:%S") ---" >> /tmp/dir_snaps.log
            for dir in $(find /builder -maxdepth 6 -name "rockchip" -type d 2>/dev/null); do
              if [ -f "$dir/Makefile" ]; then
                c=$(grep -c "lb2004" "$dir/Makefile" 2>/dev/null || echo 0)
                l=$(wc -l < "$dir/Makefile" 2>/dev/null || echo 0)
                echo "  Dir=$dir  lb2004_lines=$c  total_lines=$l" >> /tmp/dir_snaps.log
              fi
            done
            sleep 2
          done
          ) &
          echo "DIR_PROBE_PID=$!" >> $GITHUB_ENV
          echo "三维探针 PID 已记录"

      - name: Compile the kernel [ ${{ matrix.kernel_version }}]
        uses: ophub/amlogic-s9xxx-armbian@main
        if: (not (steps.done_run.outputs.status == 'failure' && cancelled()))
        with:
          build_target: kernel
          kernel_source: ${{ inputs.kernel_source }}
          kernel_version: ${{ matrix.kernel_version }}
          kernel_auto: ${{ inputs.kernel_auto }}
          delete_source: false
          kernel_package: ${{ inputs.kernel_package }}
          kernel_sign: ${{ inputs.kernel_sign }}
          kernel_toolchain: ${{ inputs.kernel_toolchain }}
          ccache_clear: ${{ inputs.ccache_clear }}
          docker_hostpath: /builder
          docker_image: ophub/armbian-${{ inputs.docker_image }}:arm64
          auto_patch: true
          kernel_patch: ${{ inputs.kernel_patch }}
          kernel_config: ${{ inputs.kernel_config }}
          enable_log: true

      - name: 🚀 Inject LB2004 DTS + compile dtb inside container
        if: ${{ steps.kernel_config.outputs.status == 'success' && !cancelled() }}
        run: |
          DOCKER_NAME=armbian-ophub
          echo "等待容器 arnbian-ophub..."
          for i in $(seq 1 30); do
            docker ps --format '{{.Names}}' | grep -q "$DOCKER_NAME" && break
            sleep 2
          done

          DTS_SRC="${{ github.workspace }}/compile-kernel/tools/patch/linux-6.1.y/rk3566-lb2004.dts"
          ROCKCHIP_DIR="/opt/kernel/compile-kernel/kernel/linux-6.1.y/arch/arm64/boot/dts/rockchip"

          echo "Step 1: 复制 替换到容器"
          docker cp "$DTS_SRC" ${DOCKER_NAME}:${ROCKCHIP_DIR}/rk3566-lb2004.dts

          echo "Step 2: 注入 替换到容器"
          docker exec ${DOCKER_NAME} sed -i '/rk3566-pinenote.dtb/a dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3566-lb2004.dtb' ${ROCKCHIP_DIR}/Makefile

          echo "Step 3: 编译 lb2004 dtb"
          docker exec ${DOCKER_NAME} bash -c "cd /opt/kernel/compile-kernel/kernel/linux-6.1.y && make ARCH=arm64 CROSS_COMPILE=aarch64-none-linux-gnu- dtbs" 2>&1 | tail -30

          echo "Step 4: 验证"
          docker exec ${DOCKER_NAME} ls -la ${ROCKCHIP_DIR}/rk3566-lb2004*



      - name: 📋 探针追踪报告 (三维)
        if: always()
        run: |
          echo "==== 三维探针追踪结果 ===="
          kill ${{ env.PROC_PROBE_PID }} ${{ env.INOTIFY_PROBE_PID }} ${{ env.DIR_PROBE_PID }} 2>/dev/null || true
          sleep 1
          echo ""
          echo "=== [1] 进程调用链 (patch/git/make/docker) ==="
          if [ -f /tmp/proc_trace.log ]; then
            sort -u /tmp/proc_trace.log | head -50
            echo "... 总行数: $(wc -l < /tmp/proc_trace.log)"
          else
            echo "(无进程追踪数据)"
          fi
          echo ""
          echo "=== [2] 文件事件 (Inotify) ==="
          if [ -s /tmp/ino_events.log ]; then
            echo "事件总数: $(wc -l < /tmp/ino_events.log)"
            head -50 /tmp/ino_events.log
          else
            echo "无文件事件(容器内操作不在宿主机产生 inotify)"
          fi
          echo ""
          echo "=== [3] 强制快照 (Makefile 条目历史) ==="
          if [ -f /tmp/dir_snaps.log ]; then
            cat /tmp/dir_snaps.log
          else
            echo "(无快照数据)"
          fi
          echo ""
      - name: 编译后全要素链路分析
        if: always()
        run: |
          echo "==== 编译后全链路分析 (7 维) ===="
          echo ""
          # ---- A: 内核配置审计 ----
          echo "--- [A] 内核配置 (.config) ---"
          KERNEL_DIR=$(find /builder/compile-kernel -maxdepth 4 -name ".config" -path "*/kernel/*" 2>/dev/null | head -1)
          if [ -f "$KERNEL_DIR" ]; then
            echo ".config: $KERNEL_DIR"
            grep -E "CONFIG_ARCH_ROCKCHIP|CONFIG_DTC|CONFIG_CCACHE|CONFIG_ARCH_RK" "$KERNEL_DIR" | head -10
          else
            echo ".config 未找到(已清理)"
          fi
          echo ""
          # ---- B: DTC 链路行为 ----
          echo "--- [B] DTC 编译链审计 ---"
          echo "/builder dtb 总数: $(find /builder/compile-kernel -name "*.o" -path "*/dts/*" 2>/dev/null | wc -l)"
          echo "output dtb 总数: $(find /builder/compile-kernel/output -name "*.dtb" 2>/dev/null | wc -l)"
          echo ""
          # ---- C: ccache 缓存 ----
          echo "--- [C] ccache 缓存 ---"
          ccache -s 2>/dev/null && echo "ccache 正常" || echo "ccache 无"
          du -sh "$HOME/.ccache" 2>/dev/null && echo "本地缓存存在" || echo "本地缓存为空"
          echo ""
          # ---- D: 补丁源代码树 ----
          echo "--- [D] 补丁源代码树 ---"
          find "${{ github.workspace }}/compile-kernel/tools/patch" -maxdepth 3 -not -empty 2>/dev/null | sort
          echo ""
          # ---- E: 容器源码挂载映射 ----
          echo "--- [E] 容器挂载映射 ---"
          find /builder -maxdepth 3 -type d 2>/dev/null | sort | head -50
          echo "... (总目录数: $(find /builder -type d 2>/dev/null | wc -l))"
          echo ""
          # ---- F: 输出制品审计 ----
          echo "--- [F] 输出制品 ---"
          find /opt/kernel/compile-kernel/output -name "*.tar.gz" 2>/dev/null && echo "找到打包文件" || echo "无打包文件"
          echo ""
          # ---- G: 打包白名单/分类 ----
          echo "--- [G] 打包分类白名单 ---"
          OUTDIR=$(find /opt/kernel/compile-kernel/output -maxdepth 1 -type d -name "kernel*" 2>/dev/null | head -1)
          if [ -n "$OUTDIR" ]; then
            echo "输出目录: $OUTDIR"
            for soc in rockchip amlogic allwinner; do
              count=$(find "$OUTDIR" -name "*.dtb" -path "*/${soc}*" 2>/dev/null | wc -l)
              echo "  $soc = ${count} 个 dtb"
            done
          else
            ls /opt/kernel/compile-kernel/output/ 2>/dev/null | head -10 || echo "output 不可访问"
          fi
          echo ""
          echo "==== 全链路分析完成 ===="


      - name: 🚀 Upload Kernel to Release
        uses: ophub/upload-to-releases@main
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        with:
          tag: kernel_stable
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: false
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            - These are Mainline LTS(Long Term Support) kernels that provide `stable` support for Armbian and OpenWrt.
            - It works with most `Amlogic`, `Rockchip`, and `Allwinner` devices. For specific details, please refer to the instructions on the homepage of repository.
            - Dedicated BSP kernels for other Rockchip and Allwinner devices can be downloaded from the [ophub/kernel](https://github.com/ophub/kernel) repository.
            - 这些是主线 LTS（长期支持）内核，为 Armbian 和 OpenWrt 提供`稳定`的支持。
            - 适用于 `amlogic`，`rockchip`，`allwinner` 的大部分设备，具体可以参考仓库首页的说明。
            - 其他的 Rockchip 和 Allwinner 设备专用 BSP 内核可以在 [ophub/kernel](https://github.com/ophub/kernel) 仓库里下载使用。
