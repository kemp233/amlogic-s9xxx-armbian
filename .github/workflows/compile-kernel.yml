name: Compile the kernel

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: "Select the kernel source"
        required: false
        default: "unifreq"
        type: choice
        options:
          - unifreq
          - ophub
      kernel_version:
        description: "Select kernel version"
        required: false
        default: "6.18.y"
        type: choice
        options:
          - all
          - 5.10.y
          - 5.15.y
          - 6.1.y
          - 6.6.y
          - 6.12.y
          - 6.18.y
      kernel_auto:
        description: "Auto use the latest kernel"
        required: false
        default: true
        type: boolean
      delete_source:
        description: "Delete source after compilation"
        required: false
        default: true
        type: boolean
      kernel_package:
        description: "Select compile package list"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - dtbs
      auto_patch:
        description: "Apply custom kernel patches"
        required: false
        default: true
        type: boolean
      kernel_toolchain:
        description: "Select the compilation toolchain"
        required: false
        default: "gcc"
        type: choice
        options:
          - clang
          - gcc
          - gcc-15.3
          - gcc-15.2
          - gcc-14.3
          - gcc-14.2
      ccache_clear:
        description: "Set whether to clear the cache"
        required: false
        default: false
        type: boolean
      docker_image:
        description: "Select Armbian docker image"
        required: false
        default: "resolute"
        type: choice
        options:
          - trixie
          - bookworm
          - resolute
          - noble
      kernel_sign:
        description: "Set the kernel custom signature"
        required: false
        default: "-ophub"
        type: choice
        options:
          - -ophub
          - -yourname

env:
  TZ: Etc/UTC

jobs:
  setup:
    runs-on: ubuntu-26.04-arm
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set build matrix based on kernel_version input
        id: set-matrix
        run: |
          if [[ "${{ inputs.kernel_version }}" == "all" ]]; then
            MATRIX='{"include":[{"kernel_version":"5.10.y"},{"kernel_version":"5.15.y"},{"kernel_version":"6.1.y"},{"kernel_version":"6.6.y"},{"kernel_version":"6.12.y"},{"kernel_version":"6.18.y"}]}'
          else
            MATRIX='{"include":[{"kernel_version":"${{ inputs.kernel_version }}"}]}'
          fi
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"

  build:
    needs: setup
    runs-on: ubuntu-26.04-arm
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    name: compile-kernel-${{ matrix.kernel_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize the build environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2604-build-armbian-depends)
          sudo systemctl daemon-reload
          #sudo apt-get -y full-upgrade
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
          sudo rm -rf ~/{.cargo,.dotnet,.rustup}
          sudo timedatectl set-timezone "${TZ:-Etc/UTC}"
          sudo ntpdate ntp.ubuntu.com 0.pool.ntp.org || true
          sudo timedatectl set-ntp true
          date -u
          timedatectl status || true
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Create virtual disk for extended storage
        id: disk
        run: |
          # Get available space in exact GB
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Error: Insufficient space on /: ${root_avail}G available"; exit 1; }

          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          echo "Using /: ${root_size}G"

          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          df -Th
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Get kernel source commit hash
        id: kernelhash
        run: |
          # Get the latest source hash from the kernel repository
          api_url="https://api.github.com/repos/${{ inputs.kernel_source }}/linux-${{ matrix.kernel_version }}/git/ref/heads/main"
          source_hash=$(curl -fsSL -m 20 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              ${api_url} |
              jq -r '.object.sha'
          )
          [[ -z "${source_hash}" || "${source_hash}" == "null" ]] && source_hash="${{ github.sha }}"
          echo "source_hash=${source_hash}" >> ${GITHUB_ENV}
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: /builder/ccache
          key: kernel-${{ inputs.kernel_toolchain }}-${{ matrix.kernel_version }}-${{ env.source_hash }}
          restore-keys: |
            kernel-${{ inputs.kernel_toolchain }}-${{ matrix.kernel_version }}-

      - name: Compile the kernel [ ${{ matrix.kernel_version }} ]
        id: compile
        uses: kemp233/amlogic-s9xxx-armbian@main
        if: ${{ steps.disk.outputs.status == 'success' && !cancelled() }}
        with:
          build_target: kernel
          kernel_source: ${{ inputs.kernel_source }}
          kernel_version: ${{ matrix.kernel_version }}
          kernel_auto: ${{ inputs.kernel_auto }}
          delete_source: ${{ inputs.delete_source }}
          kernel_package: ${{ inputs.kernel_package }}
          auto_patch: ${{ inputs.auto_patch }}
          kernel_sign: ${{ inputs.kernel_sign }}
          kernel_toolchain: ${{ inputs.kernel_toolchain }}
          ccache_clear: ${{ inputs.ccache_clear }}
          docker_hostpath: /builder
          docker_image: ophub/armbian-${{ inputs.docker_image }}:arm64

      - name: Output Debug Logs on Failure
        if: failure()
        run: |
          echo "🔍 正在查找内核编译日志..."
          echo "========================================"

          # Prepare debug folder
          DEBUG_DIR=/tmp/ci-debug-logs
          rm -rf "$DEBUG_DIR"
          mkdir -p "$DEBUG_DIR"

          # 1. 在 /builder 目录下查找所有 .log 文件并复制
          echo "1. 查找 /builder 目录下的日志文件并复制到 $DEBUG_DIR"
          find /builder -type f -name "*.log" -print0 2>/dev/null | xargs -0 -I{} bash -c 'mkdir -p "$DEBUG_DIR/$(dirname {})" && cp -a "{}" "$DEBUG_DIR/{}"' || true

          # 2. 检查 Armbian 常见日志路径
          echo "\n2. 检查 Armbian 常见日志路径:"
          for logpath in \
            "build/output/debug/output.log" \
            "build/output/debug/error.log" \
            "build/output/kernel.log" \
            "build/output/compile.log" \
            "build/output/build.log" \
            "build/output/*.log"
          do
            if [ -f "/builder/$logpath" ]; then
              echo "复制 /builder/$logpath"
              mkdir -p "$DEBUG_DIR/$(dirname /builder/$logpath)"
              cp -a "/builder/$logpath" "$DEBUG_DIR/$(dirname /builder/$logpath)/" || true
            fi
          done

          # 3. 查找内核源码目录下的日志并复制（限制数量以防占用过多空间）
          echo "\n3. 查找内核源码目录下的日志并复制:"
          find /builder/linux-* -type f -name "*.log" -print | head -n 50 | while read logfile; do
            echo "复制 $logfile"
            mkdir -p "$DEBUG_DIR/$(dirname "$logfile")"
            cp -a "$logfile" "$DEBUG_DIR/$(dirname "$logfile")/" || true
          done

          # 4. 查找并复制包含 'error' 或 'panic' 的日志行（用于快速预览）
          echo "\n4. 查找包含 'error' 或 'panic' 的日志内容:"
          find /builder -type f -name "*.log" -print0 2>/dev/null | xargs -0 -I{} grep -iHn "error\|panic\|unable to mount root" "{}" 2>/dev/null | tail -n 200 > "$DEBUG_DIR/important_log_snippets.txt" || true

          # 5. 复制任何疑似的 dmesg / boot 日志
          echo "\n5. 复制 dmesg / boot 日志:"
          find /builder -type f -iname "*dmesg*" -o -iname "*boot*.log" -o -iname "kernel.log" -print0 2>/dev/null | xargs -0 -I{} bash -c 'mkdir -p "$DEBUG_DIR/$(dirname {})" && cp -a "{}" "$DEBUG_DIR/{}"' || true

          # 6. 查找 initramfs / rootfs 映像并复制
          echo "\n6. 查找 initramfs / rootfs 镜像并复制:"
          find /builder -type f \( -iname "*initram*" -o -iname "*rootfs*" -o -iname "*.img" -o -iname "*.cpio" \) -print0 2>/dev/null | xargs -0 -I{} bash -c 'mkdir -p "$DEBUG_DIR/$(dirname {})" && cp -a "{}" "$DEBUG_DIR/{}"' || true

          # 7. 捕获 /proc/cmdline 和 /proc/partitions（如果 runner 环境可读）
          if [ -r /proc/cmdline ]; then
            echo "复制 /proc/cmdline"
            cp -a /proc/cmdline "$DEBUG_DIR/proc_cmdline" || true
          fi
          if [ -r /proc/partitions ]; then
            echo "复制 /proc/partitions"
            cp -a /proc/partitions "$DEBUG_DIR/proc_partitions" || true
          fi

          # 8. 列出 /dev 方便判断内核是否看到块设备
          echo "\n列出 /dev (前 200 行):"
          ls -l /dev | head -n 200 > "$DEBUG_DIR/dev_list.txt" || true

          # 9. 将调试目录打包为 tar.gz 以便上传
          echo "\n打包调试目录到 /tmp/ci-debug-logs.tar.gz"
          tar -czf /tmp/ci-debug-logs.tar.gz -C /tmp ci-debug-logs || ( tar -czf /tmp/ci-debug-logs.tar.gz -C /tmp ci-debug-logs . || true )
          echo "Saved archive: /tmp/ci-debug-logs.tar.gz"
          ls -l /tmp/ci-debug-logs.tar.gz || true

          echo "\n========================================"
          echo "日志查找完成"

      - name: Upload debug logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-debug-logs-${{ github.run_id }}
          path: /tmp/ci-debug-logs.tar.gz


      - name: Upload Kernel to Release
        uses: ophub/upload-to-releases@main
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        with:
          tag: kernel_stable
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: false
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            - These are Mainline LTS(Long Term Support) kernels that provide `stable` support for Armbian and OpenWrt.
            - It works with most `Amlogic`, `Rockchip`, and `Allwinner` devices. For specific details, please refer to the instructions on the homepage of repository.
            - Dedicated BSP kernels for other Rockchip and Allwinner devices can be downloaded from the [ophub/kernel](https://github.com/ophub/kernel) repository.
            - 这些是主线 LTS（长期支持）内核，为 Armbian 和 OpenWrt 提供`稳定`的支持。
            - 适用于 `amlogic`，`rockchip`，`allwinner` 的大部分设备，具体可以参考仓库首页的说明。
            - 其他的 Rockchip 和 Allwinner 设备专用 BSP 内核可以在 [ophub/kernel](https://github.com/ophub/kernel) 仓库里下载使用。
